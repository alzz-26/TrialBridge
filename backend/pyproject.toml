[project]
name = "trialbridge"
version = "0.1.0"
description = "Explainable clinical trial matching: free-text eligibility criteria to executable predicates"
readme = "../README.md"
authors = [
    { name = "alzz-26", email = "abha.basa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trialbridge = "trialbridge:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
